
name: Сборка Кубик Прыгун APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Принять лицензии и установить компоненты
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

      - name: Распаковать Android-проект
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q Kubik_Prygun_Online_Build.zip -d extracted

          PROJECT=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted -name settings.gradle -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ОШИБКА: Android-проект не найден в ZIP"
            find extracted -maxdepth 5 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

          APK=$(find app/build/outputs/apk/debug -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK не создан"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Kubik-Prygun.apk"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Kubik-Prygun-APK
          path: Kubik-Prygun.apk
          if-no-files-found: error
