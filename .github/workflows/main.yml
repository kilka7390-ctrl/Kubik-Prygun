
name: Сборка Кубик Прыгун APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Распаковать Android-проект
        run: |
          mkdir extracted
          unzip -q Kubik_Prygun_Online_Build.zip -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ОШИБКА: в ZIP не найден Android-проект с settings.gradle.kts"
            echo "Проверь содержимое Kubik_Prygun_Online_Build.zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Кубик-Прыгун.apk"

      - name: Сохранить готовую игру
        uses: actions/upload-artifact@v4
        with:
          name: Кубик-Прыгун-APK
          path: Кубик-Прыгун.apk
          if-no-files-found: error
