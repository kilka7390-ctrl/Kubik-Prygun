
name: Сборка Кубик Прыгун APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Распаковать Android-проект
        run: |
          mkdir -p extracted
          unzip -q Kubik_Prygun_Online_Build.zip -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ОШИБКА: settings.gradle.kts не найден!"
            find extracted -maxdepth 5 -type f | head -50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Kubik-Prygun.apk"

      - name: Загрузить готовую игру
        uses: actions/upload-artifact@v4
        with:
          name: Kubik-Prygun-APK
          path: Kubik-Prygun.apk
          if-no-files-found: error
