
name: Сборка Кубик Прыгун APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать файлы
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Найти Android проект
        run: |
          mkdir extracted
          unzip -q Kubik_Prygun_Online_Build.zip -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Android проект не найден!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Подготовить Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Кубик-Прыгун.apk"

      - name: Скачать готовую игру
        uses: actions/upload-artifact@v4
        with:
          name: Кубик-Прыгун-APK
          path: Кубик-Прыгун.apk
