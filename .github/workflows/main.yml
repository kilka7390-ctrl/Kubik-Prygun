
name: Сборка Кубик Прыгун APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK и принять лицензии
        shell: bash
        run: |
          SDKMANAGER=$(find /usr/local/lib/android /opt/android-sdk -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ОШИБКА: sdkmanager не найден"
            exit 1
          fi

          SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")")"

          echo "SDK Manager: $SDKMANAGER"
          echo "SDK Root: $SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

      - name: Распаковать Android-проект
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q Kubik_Prygun_Online_Build.zip -d extracted

          PROJECT=$(find extracted -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted -name settings.gradle -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ОШИБКА: Android-проект не найден в ZIP"
            find extracted -maxdepth 5 -type f | head -80
            exit 1
          fi

          echo "Найден проект: $PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

          APK=$(find app/build/outputs/apk/debug -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не создан"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Kubik-Prygun.apk"

      - name: Загрузить готовую игру
        uses: actions/upload-artifact@v4
        with:
          name: Kubik-Prygun-APK
          path: Kubik-Prygun.apk
          if-no-files-found: error
