
name: Сборка Кубик Прыгун APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать файлы
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android платформу
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Распаковать проект
        run: |
          mkdir -p extracted
          unzip -q Kubik_Prygun_Online_Build.zip -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ОШИБКА: settings.gradle.kts не найден в ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Кубик-Прыгун.apk"

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Кубик-Прыгун-APK
          path: Кубик-Прыгун.apk
          if-no-files-found: error
